<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Globe Enhanced</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');

    html,
    body,
    #cesiumContainer {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Comic Neue', cursive;
      background: linear-gradient(to bottom, #b6e2f7, #ffffff);
    }

    #infoBox {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #fff9ec;
      color: #333;
      padding: 18px;
      border-radius: 16px;
      max-width: 420px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      font-size: 14px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
      border: 2px dashed #ffd369;
      overscroll-behavior: contain;
    }

    #infoContent {
      text-align: center;
      width: 100%;
    }

    #infoContent h2 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 22px;
      color: #ff914d;
    }

    #infoContent p {
      font-style: italic;
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #666;
    }

    #infoContent img {
      margin-bottom: 12px;
      border-radius: 12px;
      max-height: 200px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    #infoContent details {
      margin: 14px 0;
      background: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid #ffc93c;
      transition: all 0.3s ease;
    }

    #infoContent .info-image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    #infoContent .info-image-card {
      margin: 0;
      padding: 10px;
      background: linear-gradient(180deg, #fffdf7 0%, #fff2dc 100%);
      border: 1px solid #ffd28a;
      border-radius: 14px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    #infoContent .info-image-card img {
      display: block;
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin: 0;
      box-shadow: none;
    }

    #infoContent .info-image-card figcaption {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.35;
      color: #7a5130;
      text-align: left;
      font-style: normal;
      word-break: break-word;
    }

    #infoContent li .info-image-card {
      margin-top: 10px;
    }

    #infoContent li .info-image-card img {
      height: 160px;
      object-fit: cover;
    }

    #infoContent summary {
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      color: #f47c7c;
    }

    #infoContent ul {
      padding-left: 20px;
      margin-top: 5px;
    }

    #infoContent li {
      text-align: left;
      margin-bottom: 6px;
    }

    #closeInfoBox {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 4px 10px;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    #creditContainer {
      display: none;
    }

    #zoomControls {
      position: fixed;
      bottom: 30px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 99999;
      pointer-events: auto;
    }

    #zoomControls button {
      width: 40px;
      height: 40px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: #444;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
    }

    #zoomControls button:hover {
      background: #fff;
      color: #ff914d;
    }

    /* top controls row */
    /* ===== TOP CONTROL CONTAINER ===== */
    #countrySearchWidget {
      position: fixed;
      top: 14px;
      right: 14px;

      display: flex;
      align-items: center;
      gap: 12px;

      z-index: 99999;
    }

    /* ===== RESET CESIUM DEFAULT STYLES ===== */
    .cesium-button,
    .cesium-toolbar-button,
    .cesium-home-button {
      background-image: none !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* ===== CUSTOM BUTTON STYLE ===== */
    .top-control-btn,
    .cesium-home-button {
      width: 48px !important;
      height: 48px !important;

      min-width: 48px !important;
      min-height: 48px !important;

      border-radius: 16px !important;

      background: rgba(30, 30, 30, 0.88) !important;
      backdrop-filter: blur(12px);

      display: flex !important;
      align-items: center !important;
      justify-content: center !important;

      padding: 0 !important;
      margin: 0 !important;

      overflow: hidden !important;
      box-sizing: border-box !important;

      box-shadow: 0 8px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.04) !important;

      position: relative !important;
      line-height: 0;

      transition:
        transform 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;

      cursor: pointer;

      color: white !important;
    }

    /* ===== HOVER ===== */
    .top-control-btn:hover,
    .cesium-home-button:hover {
      background: rgba(45,45,45,0.96) !important;
      transform: translateY(-1px);
    }

    /* ===== ACTIVE ===== */
    .top-control-btn:active,
    .cesium-home-button:active {
      transform: scale(0.96);
    }

    /* ===== SEARCH ICON ===== */
    .top-control-btn svg {
      width: 22px !important;
      height: 22px !important;

      fill: white !important;
      color: white !important;

      display: block !important;
    }

    /* ===== HOME ICON ===== */
    .cesium-home-button svg,
    .cesium-home-button .cesium-svgPath-svg {
      width: 22px !important;
      height: 22px !important;

      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      right: auto !important;
      bottom: auto !important;
      transform: translate(-50%, -50%) !important;
      margin: 0 !important;

      fill: white !important;
      color: white !important;

      display: block !important;
    }

    /* ===== FIX CESIUM INNER WRAPPER ===== */
    .cesium-home-button canvas,
    .cesium-home-button img,
    .cesium-home-button div {
      pointer-events: none;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 600px) {
      #countrySearchWidget {
        top: 10px;
        right: 10px;
        gap: 10px;
      }

      .top-control-btn,
      .cesium-home-button {
        width: 46px !important;
        height: 46px !important;
      }
    }

    .search-input-container {
      height: 44px;
      width: 0;
      max-width: 260px;
      display: flex;
      align-items: center;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: translateX(8px);
      transition: width 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    #countrySearchWidget.open .search-input-container {
      width: 260px;
      max-width: 260px;
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    #countrySearchInput {
      width: 100%;
      height: 44px;
      box-sizing: border-box;
      border: none;
      outline: none;
      padding: 0 14px;
      font-family: inherit;
      font-size: 14px;
      color: #444;
      background: transparent;
    }

    .top-control-btn:focus-visible,
    #countrySearchInput:focus-visible {
      outline: 2px solid #ff914d;
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      #countrySearchWidget {
        top: 10px;
      }

      #countrySearchWidget.open .search-input-container {
        width: 220px;
        max-width: 220px;
      }
    }

    @media (max-width: 600px) {
      #infoBox {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        border-radius: 0;
        font-size: 16px;
        overflow-y: auto;
        padding: 48px 16px 16px 16px;
        box-sizing: border-box;

        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
      }

      #infoBox #closeInfoBox {
        top: 8px;
        right: 8px;
      }

      #appLogo {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 100px; /* adjust as needed */
        height: auto;
        z-index: 998;
        opacity: 0.95;
        transition: transform 0.3s ease;
      }
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <div id="creditContainer" style="display: none;"></div>
  <!-- <div id="appName">SPARKI</div> -->


  <div id="infoBox" style="display: none;">
    <button id="closeInfoBox">×</button>
    <div id="infoContent">Click anywhere on the globe 🌍</div>
  </div>

  <div id="countrySearchWidget" aria-label="Country search">
    <div class="search-input-container">
      <input id="countrySearchInput" type="text" placeholder="Search country" autocomplete="off" spellcheck="false" aria-label="Search country">
    </div>
    <button id="countrySearchToggle" class="top-control-btn" title="Search Country" aria-label="Search Country">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.79l5 5 1.5-1.5-5-5Zm-6 0A4.5 4.5 0 1 1 10 5a4.5 4.5 0 0 1-.5 9Z" fill="currentColor"></path>
      </svg>
    </button>
  </div>

  <div id="zoomControls">
    <button id="zoomIn" title="Zoom In">+</button>
    <button id="zoomOut" title="Zoom Out">−</button>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <img id="appLogo" src="images/Sparki.png" alt="App Logo">

</body>

</html>
