<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Globe Enhanced</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap');

    html,
    body,
    #cesiumContainer {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Comic Neue', cursive;
      background: linear-gradient(to bottom, #b6e2f7, #ffffff);
    }

    #infoBox {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #fff9ec;
      color: #333;
      padding: 18px;
      border-radius: 16px;
      max-width: 420px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      font-size: 14px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
      border: 2px dashed #ffd369;
      overscroll-behavior: contain;
    }

    #infoContent {
      text-align: center;
      width: 100%;
    }

    #infoContent h2 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 22px;
      color: #ff914d;
    }

    #infoContent p {
      font-style: italic;
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #666;
    }

    #infoContent img {
      margin-bottom: 12px;
      border-radius: 12px;
      max-height: 200px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    #infoContent details {
      margin: 14px 0;
      background: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid #ffc93c;
      transition: all 0.3s ease;
    }

    #infoContent .info-image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    #infoContent .info-image-card {
      margin: 0;
      padding: 10px;
      background: linear-gradient(180deg, #fffdf7 0%, #fff2dc 100%);
      border: 1px solid #ffd28a;
      border-radius: 14px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    #infoContent .info-image-card img {
      display: block;
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      margin: 0;
      box-shadow: none;
    }

    #infoContent .info-image-card figcaption {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.35;
      color: #7a5130;
      text-align: left;
      font-style: normal;
      word-break: break-word;
    }

    #infoContent li .info-image-card {
      margin-top: 10px;
    }

    #infoContent li .info-image-card img {
      height: 160px;
      object-fit: cover;
    }

    #infoContent summary {
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      color: #f47c7c;
    }

    #infoContent ul {
      padding-left: 20px;
      margin-top: 5px;
    }

    #infoContent li {
      text-align: left;
      margin-bottom: 6px;
    }

    #closeInfoBox {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 4px 10px;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    #creditContainer {
      display: none;
    }

    #zoomControls {
      position: fixed;
      bottom: 30px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 99999;
      pointer-events: auto;
    }

    #zoomControls button {
      width: 40px;
      height: 40px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: #444;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
    }

    #zoomControls button:hover {
      background: #fff;
      color: #ff914d;
    }

    @media (max-width: 600px) {
      #infoBox {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        border-radius: 0;
        font-size: 16px;
        overflow-y: auto;
        padding: 48px 16px 16px 16px;
        box-sizing: border-box;

        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
      }

      #infoBox #closeInfoBox {
        top: 8px;
        right: 8px;
      }

      #appLogo {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 100px; /* adjust as needed */
        height: auto;
        z-index: 998;
        opacity: 0.95;
        transition: transform 0.3s ease;
      }
    }
  </style>
</head>

<body>
  <div id="cesiumContainer"></div>
  <div id="creditContainer" style="display: none;"></div>
  <!-- <div id="appName">SPARKI</div> -->


  <div id="infoBox" style="display: none;">
    <button id="closeInfoBox">×</button>
    <div id="infoContent">Click anywhere on the globe 🌍</div>
  </div>

  <div id="zoomControls">
    <button id="zoomIn" title="Zoom In">+</button>
    <button id="zoomOut" title="Zoom Out">−</button>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <img id="appLogo" src="images/Sparki.png" alt="App Logo">

</body>

</html>
